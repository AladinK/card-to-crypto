name: GitHub Pages

# Publishes the static project site (site/), the API reference (docs/openapi.yaml rendered with Redoc)
# to https://aladink.github.io/card-to-crypto/. The API, worker and database are not part of the site.
# One-time setup: repository Settings -> Pages -> Build and deployment -> Source: GitHub Actions.

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs/openapi.yaml'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Assemble site
        run: |
          set -euo pipefail
          mkdir -p _site/vendor
          cp -R site/. _site/
          cp docs/openapi.yaml _site/openapi.yaml
          # Redoc is pinned and fetched at build time, so the repository does not carry the bundle.
          cd "$RUNNER_TEMP"
          npm pack redoc@3.2.0 --silent
          tar -xzf redoc-3.2.0.tgz package/bundles/redoc.standalone.js
          mv package/bundles/redoc.standalone.js "$GITHUB_WORKSPACE/_site/vendor/redoc.standalone.js"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
